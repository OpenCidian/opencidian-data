name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes the run

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('sources/*/source.json') }}
      - run: npm ci
      - run: npm run fetch-sources
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
